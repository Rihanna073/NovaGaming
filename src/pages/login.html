<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Gaming – Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-base="../../" data-page="login">
  <div id="cabecera"></div>

  <main class="zona-acceso">
    <div class="cuadro-acceso">
      <div class="pestanas">
        <button class="pestana activo" data-tab="login">Iniciar sesión</button>
        <button class="pestana" data-tab="register">Registrarse</button>
      </div>

      <div>
        <h1 id="titulo">Bienvenido de vuelta</h1>
        <p class="introduccion" id="introduccion">Ingresa tus datos para continuar con tu experiencia en Nova Gaming.</p>
      </div>

      <form class="form-acceso" id="form-acceso">
        <div class="campo oculto" id="campo-nombre">
          <label for="name">Nombre completo</label>
          <input class="entrada" id="nombre-completo" placeholder="Ej. Juan Pérez">
        </div>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input class="entrada" id="correo-electronico" type="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input class="entrada" id="clave" type="password" placeholder="••••••••" required>
        </div>
        <a href="#" class="enlace" id="olvido-clave">¿Olvidaste tu contraseña?</a>
        <button class="boton boton-grande boton-ancho" id="enviar">Iniciar sesión</button>
      </form>

      <div class="o">o continúa con</div>
      <div class="red-social">
        <button class="boton"><i data-icon="google"></i>Google</button>
        <button class="boton"><i data-icon="apple"></i>Apple</button>
      </div>

      <p class="pie-acceso" id="pie">¿No tienes cuenta? <a href="#" class="enlace" data-tab="register">Regístrate</a></p>
    </div>
  </main>

  <div id="pie"></div>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
